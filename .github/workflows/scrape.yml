name: Scrape DIU Notices

on:
  # Run every 6 hours — free on GitHub Actions, no Vercel Pro needed
  schedule:
    - cron: "0 */6 * * *"
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  scrape:
    name: Run Notice Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Trigger scrape pipeline
        run: |
          echo "Calling scrape endpoint at $DEPLOY_URL"
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$DEPLOY_URL/api/cron/scrape")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP $HTTP_CODE"
          echo "$BODY"

          # Fail the job if the endpoint returned an error
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Scrape endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi

          echo "✅ Scrape complete"
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
